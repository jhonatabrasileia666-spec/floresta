name: Inspect actual torch rendering
on:
  push:
    branches: [fix/duo-exact-geometry-20261024]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect original torch model and its placement
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const f of ['Jogo.html','modulos/014_engine_core_camera_blood.js','modulos/043_legacy_042.js','modulos/159_floresta_duo_native_avatar.js']){
            const s=fs.readFileSync(f,'utf8');
            console.log('FILE',f,'length',s.length);
            const terms=['torchRoot','torchMesh','torchGroup','torchHandle','torchBody','torchFlame','flameRoot','torchLight','isEquipped','makeTorch','gameReview','torchModel','makeAxeModel','gameRightHand','FlorestaEquipmentModels'];
            for(const t of terms){
              const hit=[];let i=-1;while((i=s.indexOf(t,i+1))>=0&&hit.length<75)hit.push(i);
              console.log('HIT',t,'TOTAL up-to',hit.length,'at',hit.slice(0,12));
              for(const k of hit.slice(0,3))console.log('SNIP',t,k,JSON.stringify(s.slice(Math.max(0,k-350),k+650)));
            }
          }
          NODE
