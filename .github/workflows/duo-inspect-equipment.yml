name: Inspect multiplayer native equipment factories
on:
  push:
    branches: [fix/duo-native-equipment-work-release]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect runtime factories (bounded snippets)
        run: |
          node <<'NODE'
          const fs=require('fs');const path=require('path');
          const targets=['gameRightHand','gameShield','gameReview','torchMesh','torchObject','equipBtn','makeTorch','createTorch'];
          for(const dir of ['modulos','fonte']){
           for(const file of fs.readdirSync(dir)){
            const f=path.join(dir,file);if(!f.endsWith('.js'))continue;
            const txt=fs.readFileSync(f,'utf8');const hits=targets.map(t=>({t,count:txt.split(t).length-1})).filter(o=>o.count>0);
            if(hits.length)console.log('SOURCES',JSON.stringify({f,bytes:txt.length,hits}));
           }
          }
          NODE
