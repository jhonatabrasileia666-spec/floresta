<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101510"><title>FLORESTA V279 — Mobile</title><meta name="floresta-version" content="V279"><style>body{margin:0;min-height:100dvh;display:grid;place-content:center;background:#101510;color:#ece5cd;font:15px system-ui;text-align:center;padding:20px;box-sizing:border-box}a{color:#e4c38d;padding:16px;display:block}</style></head>
<body><p>Preparando a floresta…</p><a href="Jogo.html?platform=mobile&amp;ui=279">Abrir FLORESTA V279 — Mobile</a>
<script>
(async()=>{
 // Give the existing PWA worker time to activate its new cache before loading the game.
 // No save keys or gameplay data are touched.
 if('serviceWorker' in navigator){try{
  const reg=await navigator.serviceWorker.getRegistration();
  if(reg){await Promise.race([reg.update(),new Promise(r=>setTimeout(r,2000))]);
   const worker=reg.installing||reg.waiting;
   if(worker&&worker.state!=='activated'&&worker.state!=='redundant')await Promise.race([
    new Promise(resolve=>worker.addEventListener('statechange',()=>{if(worker.state==='activated'||worker.state==='redundant')resolve()})),
    new Promise(resolve=>setTimeout(resolve,2000))
   ]);
  }
 }catch{}}
 // Migrate old iPhone PWA JavaScript caches; keep saves and large 3D assets.
 // Jogo.html has legacy query versions in script tags, so a fresh SW alone
 // may not immediately refresh previously cached sources on older Safari.
 let shouldRefresh=true;try{shouldRefresh=!sessionStorage.getItem('floresta-mobile-v279-code-refresh')}catch{};
 if(navigator.onLine!==false && 'caches' in window && shouldRefresh){
  try{
   const probe=await fetch('modulos/000_floresta-release.js?check=v279',{cache:'no-store'});
   if(probe.ok && (await probe.text()).includes('"version":"V279"')){
    const versions=(await caches.keys()).filter(k=>k.startsWith('floresta-v'));
    for(const name of versions){
     const cache=await caches.open(name);
     const old=(await cache.keys()).filter(req=>{
      const path=new URL(req.url).pathname;
      return path.includes('/modulos/') && path.endsWith('.js');
     });
     await Promise.all(old.map(req=>cache.delete(req)));
    }
    await Promise.race([Promise.allSettled([
     fetch('modulos/000_floresta-release.js?v=264',{cache:'reload'}),
     fetch('modulos/002_legacy_001.js',{cache:'reload'}),
     fetch('modulos/004_floresta-menu172-bootstrap.js?v=264',{cache:'reload'}),
     fetch('modulos/096_legacy_095.js?v=255',{cache:'reload'})
    ]),new Promise(resolve=>setTimeout(resolve,3500))]);
    sessionStorage.setItem('floresta-mobile-v279-code-refresh','1');
   }
  }catch(e){console.warn('FLORESTA: atualização de scripts iOS',e)}
 }
 location.replace('Jogo.html?platform=mobile&ui=279');
})();
</script></body></html>
